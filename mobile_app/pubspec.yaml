name: meqs_feedback
description: "Ideal Feedback — iDEAL-Q customer feedback app for kiosks, tablets and phones."
publish_to: 'none'

version: 1.0.0+1

environment:
  # Matches the Dart 3.12.0 bundled with the installed Flutter 3.44.0 stable.
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Arabic/English localization + RTL support.
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8

  # GetX: state management, routing, dependency injection, i18n (Get.updateLocale).
  get: ^4.6.6

  # HTTP client for the REST API (beaa/api/v1/...).
  http: ^1.2.2

  # Local persistence for Settings (API base URL, language, titles).
  get_storage: ^2.1.1

  # Responsive sizing across phone <-> 10.95" tablet (Ministry of Environment tablets).
  flutter_screenutil: ^5.9.3

  # Fonts: Cairo (Arabic) + Poppins (English), selected per active locale.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generates adaptive launcher icons from the iDEAL-Q logo.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/branding/

# ─── Launcher icons (run: dart run flutter_launcher_icons) ────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/app_icon.png"
